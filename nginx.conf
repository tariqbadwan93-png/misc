server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Only Coolify's Traefik reaches this container; trust it and read the visitor IP Cloudflare forwards.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
  gzip_min_length 1024;

  # No add_header inside locations, so these inherit everywhere.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Images and fonts change rarely; css/js are unversioned, so keep them short and let ETag revalidate.
  location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2)$ { expires 30d; try_files $uri =404; }
  location ~* \.(?:css|js)$ { expires 10m; try_files $uri =404; }
  location ~* \.(?:txt|xml)$ { expires 1h; try_files $uri =404; }

  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }
}
